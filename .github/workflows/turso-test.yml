name: Turso Connection Test

on:
  workflow_dispatch:

jobs:
  test-turso-connection:
    name: Test Turso Database Connection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Turso client dependency
        run: |
          python -m pip install --upgrade pip
          pip install libsql-client

      - name: Test Turso database connection
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import libsql_client

          db_url = os.environ.get("TURSO_DATABASE_URL", "").strip()
          auth_token = os.environ.get("TURSO_AUTH_TOKEN", "").strip()

          if not db_url:
              print("❌ Error: TURSO_DATABASE_URL environment variable is missing.")
              sys.exit(1)

          if not auth_token:
              print("❌ Error: TURSO_AUTH_TOKEN environment variable is missing.")
              sys.exit(1)

          # Non-sensitive sanitized URL logging (showing protocol and domain, never auth credentials)
          url_preview = db_url.split("?")[0]
          print(f"Initiating connection to Turso database target: {url_preview}")

          try:
              client = libsql_client.create_client_sync(url=db_url, auth_token=auth_token)
              result = client.execute("SELECT 1 AS connection_status")
              if result and len(result.rows) > 0 and result.rows[0][0] == 1:
                  print("✅ Successfully connected to Turso database!")
                  print("✅ Query 'SELECT 1 AS connection_status' returned: 1")
              else:
                  print(f"⚠️ Query executed but returned unexpected result: {result.rows}")
                  sys.exit(1)
              client.close()
          except Exception as exc:
              print(f"❌ Connection failed: {exc}")
              sys.exit(1)
          EOF

      - name: Report connection status
        if: success()
        run: |
          echo "✅ Turso connection test completed successfully."

      - name: Report connection failure
        if: failure()
        run: |
          echo "❌ Turso connection test failed on GitHub Actions runner."
