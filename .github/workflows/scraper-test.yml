name: FareIndex Daily Scraper

on:
  schedule:
    # Run once every 24 hours at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  test-scraper:
    name: Run Playwright Scraper Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and Linux dependencies
        run: |
          playwright install --with-deps chromium

      - name: Initialize Turso database schema
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -c "from app.db import init_db; init_db(); print('✅ Turso database schema verified and initialized.')"

      - name: Run integrated Playwright scraper
        env:
          FARE_PROVIDER: playwright
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -c "import os; os.environ['FARE_PROVIDER']='playwright'; from app.scrape_service import scrape_all_routes; print(scrape_all_routes())"

      - name: Report scraper execution status
        if: success()
        run: |
          echo "✅ FareIndex Playwright scraper completed successfully on GitHub Actions runner."

      - name: Report scraper failure
        if: failure()
        run: |
          echo "❌ FareIndex Playwright scraper failed on GitHub Actions runner."
